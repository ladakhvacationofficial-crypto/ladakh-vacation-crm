# Render Blueprint for the Ladakh Vacation backend.
# Push to GitHub, then in Render: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: ladakh-vacation-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false        # set in the Render dashboard — Supabase POOLED URI (6543)
      - key: DIRECT_URL
        sync: false        # set in the Render dashboard — Supabase DIRECT URI (5432).
                           # Required: schema.prisma declares directUrl, and the
                           # start command runs `prisma migrate deploy`, which
                           # cannot go through pgbouncer.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        value: "*"
      - key: PAGESPEED_API_KEY
        sync: false        # optional — lifts PSI's per-IP quota. Free from
                           # https://developers.google.com/speed/docs/insights/v5/get-started
